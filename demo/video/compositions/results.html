        var z = 1.96, p = k / n, d = 1 + z * z / n;
        var c = (p + z * z / (2 * n)) / d;
        var h = z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n)) / d;
        return [Math.max(0, c - h) * 100, Math.min(1, c + h) * 100];

        var vw = document.createElement("div");

        vw.style.height = ((ci[1] - ci[0]) * 5.6) + "px";
        c.parentNode.appendChild(vw);

      });

      function count(el, to, dec, suffix, at, dur) {

      }

      // flood: dark console ground -> amber

      tl.fromTo("#res-frame1 .axis", { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "expo.out" }, 2.4);
      tl.fromTo(".r1lab", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.4, stagger: 0.06, ease: "expo.out" }, 2.5);

      // catch bars

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });

      // ---- Camera states (img natural box 1920 x 3413, origin top-left) ----
      // HOOK: 1100 px wide portrait on the left, face + phone in frame
      const HOOK = { scale: 0.5729, x: 0, y: -330 };
      const HOOK_END = { scale: 0.5900, x: -6, y: -362 };   // slow drift of the world
      // PROBLEM: punch-in on the phone in his hand, full bleed
      const PUNCH = { scale: 1.0, x: 0, y: -1450 };
      const PUNCH_END = { scale: 1.03, x: -24, y: -1500 };
      // HAND-OFF: exactly the footage panel, 608 x 1081 at x 0
      const PANEL = { scale: 608 / 1920, x: 0, y: 0 };

      tl.fromTo("#intro-photo", { ...HOOK, transformOrigin: "0 0" },
        { ...HOOK_END, duration: 4, ease: "none" }, 0);
      tl.set("#intro-photo", { ...PUNCH }, 4);
      tl.set("#intro-scrim-side", { opacity: 0 }, 4);
      tl.set("#intro-scrim-flat", { opacity: 1 }, 4);
      tl.fromTo("#intro-photo", { ...PUNCH },
        { ...PUNCH_END, duration: 3.9, ease: "none", immediateRender: false }, 4);
      tl.fromTo("#intro-photo", { ...PUNCH_END },
        { ...PANEL, duration: 1.0, ease: "power3.inOut", immediateRender: false }, 7.9);
      tl.fromTo("#intro-scrim-flat", { opacity: 1 },
        { opacity: 0, duration: 0.8, ease: "power2.inOut", immediateRender: false }, 7.95);

      // ---- HOOK lines ----
      tl.fromTo("#intro-hook-a .w", { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.16, stagger: 0.09, ease: "power4.out" }, 0.12);
      tl.to("#intro-hook-a .w", { opacity: 0, filter: "blur(8px)", duration: 0.14, stagger: 0.03, ease: "power3.in" }, 1.68);

      tl.fromTo("#intro-hook-b1", { opacity: 0, filter: "blur(10px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 1.86);
      tl.fromTo("#intro-hook-b2", { clipPath: "inset(0 100% 0 0)" },
        { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "expo.out" }, 2.6);

      // ---- PROBLEM ----
      const num = { v: 0 };
      tl.fromTo(num, { v: 0 }, {
        v: 7.7, duration: 1.1, ease: "expo.out",
        onUpdate: () => {
          const el = document.getElementById("intro-num-val");
          if (el) el.textContent = num.v.toFixed(1);
        }
      }, 4.05);
      tl.fromTo("#intro-num", { opacity: 0, scale: 1.06 },
        { opacity: 1, scale: 1, duration: 0.45, ease: "expo.out" }, 4.02);
      tl.fromTo("#intro-cap .w", { opacity: 0.12 },
        { opacity: 1, duration: 0.12, stagger: 0.08, ease: "power2.out" }, 4.55);
      tl.fromTo("#intro-src", { opacity: 0 },
        { opacity: 1, duration: 0.3, ease: "power2.out" }, 5.1);
      tl.fromTo("#intro-trust .w", { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.14, stagger: 0.07, ease: "power4.out" }, 5.55);
      tl.to("#intro-stat-box, #intro-trust", { opacity: 0, filter: "blur(10px)", duration: 0.2, ease: "power3.in" }, 7.8);

      // ---- REVEAL ----
      tl.fromTo("#intro-name .w", { opacity: 0.0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.22, stagger: 0.07, ease: "power4.out" }, 8.3);
      tl.fromTo("#intro-tag", { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 8.85);

      // three steps, one per beat; the spine draws down to each node
      tl.fromTo("#intro-spine", { scaleY: 0 }, { scaleY: 0, duration: 0.01 }, 7.95);
      const steps = [
        { at: 9.4, n: 1 },
        { at: 10.15, n: 2 },
        { at: 10.9, n: 3 },
      ];
      steps.forEach(({ at, n }) => {
        if (n > 1) {
          tl.fromTo("#intro-spine", { scaleY: (n - 2) / 2 },
            { scaleY: (n - 1) / 2, duration: 0.25, ease: "power2.inOut", immediateRender: false }, at - 0.2);
        }
        tl.fromTo("#intro-node" + n, { scale: 0 },
          { scale: 1, duration: 0.35, ease: "back.out(1.6)" }, at);
        tl.fromTo("#intro-verb" + n, { clipPath: "inset(0 100% 0 0)" },
          { clipPath: "inset(0 0% 0 0)", duration: 0.45, ease: "expo.out" }, at + 0.03);
        tl.fromTo("#intro-det" + n, { opacity: 0, filter: "blur(6px)" },
          { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, at + 0.2);
      });

      tl.fromTo("#intro-take", { clipPath: "inset(0 100% 0 0)" },
        { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "expo.out" }, 11.55);

      tl.set({}, {}, 13);
      window.__timelines = window.__timelines || {};
      window.__timelines["intro"] = tl;
    })();
  </script>

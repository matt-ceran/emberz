<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 382" width="820" height="382" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<rect width="820" height="382" fill="#fcfcfb"/>
<text x="16" y="26" font-size="16" font-weight="600" fill="#0b0b0b">Real-audio test set: fine-tuned guardian vs frontier baselines (call level, Wilson 95% CI)</text>

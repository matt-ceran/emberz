<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 232" width="760" height="232" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<rect width="760" height="232" fill="#fcfcfb"/>
<text x="16" y="26" font-size="16" font-weight="600" fill="#0b0b0b">Real-audio test set: frontier baselines (call level, Wilson 95% CI)</text>
<text x="16" y="46" font-size="12" fill="#52514e">61 real robocalls (NCSU, public domain) vs 50 HarperValley bank calls, 8 kHz mu-law + live Nemotron ASR, guardian prompt 806908cfba7d</text>
<text x="150" y="62" font-size="12" font-weight="600" fill="#0b0b0b">Scam recall (higher is better)</text>
<line x1="150" y1="70" x2="150" y2="172" stroke="#e6e5e0" stroke-width="1"/>
<text x="150" y="188" font-size="11" fill="#52514e" text-anchor="middle">0%</text>
<line x1="212.5" y1="70" x2="212.5" y2="172" stroke="#e6e5e0" stroke-width="1"/>
<text x="212.5" y="188" font-size="11" fill="#52514e" text-anchor="middle">25%</text>
<line x1="275.0" y1="70" x2="275.0" y2="172" stroke="#e6e5e0" stroke-width="1"/>
<text x="275.0" y="188" font-size="11" fill="#52514e" text-anchor="middle">50%</text>
<line x1="337.5" y1="70" x2="337.5" y2="172" stroke="#e6e5e0" stroke-width="1"/>
<text x="337.5" y="188" font-size="11" fill="#52514e" text-anchor="middle">75%</text>
<line x1="400.0" y1="70" x2="400.0" y2="172" stroke="#e6e5e0" stroke-width="1"/>
<text x="400.0" y="188" font-size="11" fill="#52514e" text-anchor="middle">100%</text>
<text x="138" y="91.0" font-size="12" fill="#0b0b0b" text-anchor="end">qwen3p8-max</text>
<line x1="360.79999999999995" y1="87.0" x2="393.54999999999995" y2="87.0" stroke="#eb6834" stroke-width="2" stroke-linecap="round"/>
<circle cx="383.6" cy="87.0" r="5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"><title>qwen3p8-max: 57/61 = 93% (95% CI 84%-97%)</title></circle>
<text x="354.79999999999995" y="81.0" font-size="11" fill="#52514e" text-anchor="end">57/61</text>
<text x="138" y="125.0" font-size="12" fill="#0b0b0b" text-anchor="end">kimi-k3</text>
<line x1="366.275" y1="121.0" x2="395.775" y2="121.0" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
<circle cx="387.7" cy="121.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"><title>kimi-k3: 58/61 = 95% (95% CI 87%-98%)</title></circle>
<text x="360.275" y="115.0" font-size="11" fill="#52514e" text-anchor="end">58/61</text>
<text x="138" y="159.0" font-size="12" fill="#0b0b0b" text-anchor="end">keyword-stub</text>
<line x1="150.725" y1="155.0" x2="171.8" y2="155.0" stroke="#52514e" stroke-width="2" stroke-linecap="round"/>
<circle cx="154.1" cy="155.0" r="5" fill="#52514e" stroke="#fcfcfb" stroke-width="2"><title>keyword-stub: 1/61 = 2% (95% CI 0%-9%)</title></circle>
<text x="177.8" y="149.0" font-size="11" fill="#52514e" text-anchor="start">1/61</text>
<text x="450" y="62" font-size="12" font-weight="600" fill="#0b0b0b">False alarms on benign (lower is better)</text>
<line x1="450" y1="70" x2="450" y2="172" stroke="#e6e5e0" stroke-width="1"/>
<text x="450" y="188" font-size="11" fill="#52514e" text-anchor="middle">0%</text>
<line x1="512.5" y1="70" x2="512.5" y2="172" stroke="#e6e5e0" stroke-width="1"/>
<text x="512.5" y="188" font-size="11" fill="#52514e" text-anchor="middle">25%</text>
<line x1="575.0" y1="70" x2="575.0" y2="172" stroke="#e6e5e0" stroke-width="1"/>
<text x="575.0" y="188" font-size="11" fill="#52514e" text-anchor="middle">50%</text>
<line x1="637.5" y1="70" x2="637.5" y2="172" stroke="#e6e5e0" stroke-width="1"/>
<text x="637.5" y="188" font-size="11" fill="#52514e" text-anchor="middle">75%</text>
<line x1="700.0" y1="70" x2="700.0" y2="172" stroke="#e6e5e0" stroke-width="1"/>
<text x="700.0" y="188" font-size="11" fill="#52514e" text-anchor="middle">100%</text>
<line x1="474.425" y1="87.0" x2="527.0" y2="87.0" stroke="#eb6834" stroke-width="2" stroke-linecap="round"/>
<circle cx="495.0" cy="87.0" r="5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"><title>qwen3p8-max: 9/50 = 18% (95% CI 10%-31%)</title></circle>
<text x="533.0" y="81.0" font-size="11" fill="#52514e" text-anchor="start">9/50</text>
<line x1="478.1" y1="121.0" x2="532.6" y2="121.0" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
<circle cx="500.0" cy="121.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"><title>kimi-k3: 10/50 = 20% (95% CI 11%-33%)</title></circle>
<text x="538.6" y="115.0" font-size="11" fill="#52514e" text-anchor="start">10/50</text>
<line x1="457.875" y1="155.0" x2="497.1" y2="155.0" stroke="#52514e" stroke-width="2" stroke-linecap="round"/>
<circle cx="470.0" cy="155.0" r="5" fill="#52514e" stroke="#fcfcfb" stroke-width="2"><title>keyword-stub: 4/50 = 8% (95% CI 3%-19%)</title></circle>
<text x="503.1" y="149.0" font-size="11" fill="#52514e" text-anchor="start">4/50</text>
<text x="16" y="220" font-size="11" fill="#52514e">Flag = any caller turn scored alert or urgent (last 8 turns). Robocalls are one-sided prerecorded messages; HarperValley is role-played.</text>
</svg>